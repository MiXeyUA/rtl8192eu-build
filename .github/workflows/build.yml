name: Build RTL8192EU for Lavender
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y bc build-essential libncurses5-dev libssl-dev crossbuild-essential-arm64

      - name: Checkout Driver
        uses: actions/checkout@v4
        with:
          repository: Mange/rtl8192eu-linux-driver
          path: driver

      - name: Download Kernel Source
        run: |
          curl -L https://github.com/Team-420/android_kernel_xiaomi_lavender/archive/refs/tags/Nethunter-v3.5.tar.gz -o kernel.tar.gz
          tar -xzf kernel.tar.gz
          mv android_kernel_xiaomi_lavender-Nethunter-v3.5 kernel

      - name: Prepare Driver Makefile
        run: |
          cd driver
          # Отключаем i386 и включаем ARM64 в самом Makefile
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_RPI = n/CONFIG_PLATFORM_ARM_RPI = y/g' Makefile

      - name: Build Module
        run: |
          cd driver
          # Передаем параметры сборки
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KSRC=$GITHUB_WORKSPACE/kernel -j$(nproc)

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-module
          path: driver/*.ko
