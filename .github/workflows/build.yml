name: Build RTL8192EU for Lavender
on: [push, workflow_dispatch]

# Устанавливаем переменную окружения для Node.js 24, чтобы GitHub не ругался
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y bc build-essential libncurses5-dev libssl-dev crossbuild-essential-arm64

      - name: Checkout Driver
        uses: actions/checkout@v4
        with:
          repository: Mange/rtl8192eu-linux-driver
          path: driver

      - name: Download and Extract Kernel
        run: |
          curl -L https://github.com/Team-420/android_kernel_xiaomi_lavender/archive/refs/tags/Nethunter-v3.5.tar.gz -o kernel.tar.gz
          tar -xzf kernel.tar.gz
          # Находим точное имя папки после распаковки
          mv android_kernel_xiaomi_lavender-* kernel

      - name: Prepare Module Source
        run: |
          cd driver
          # Принудительно правим конфиг драйвера под ARM64
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/g' Makefile

      - name: Build Module
        run: |
          cd driver
          # Используем KSRC с полным путем
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KSRC=$GITHUB_WORKSPACE/kernel -j$(nproc)

      - name: Upload Result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-lavender-module
          path: driver/*.ko
